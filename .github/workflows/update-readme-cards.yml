name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # refresh once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=muhe-byte&show_icons=true&theme=tokyonight&title_color=2EA44F&icon_color=2EA44F&hide_border=true&bg_color=0D1117
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=muhe-byte&layout=compact&theme=tokyonight&title_color=2EA44F&hide_border=true&bg_color=0D1117&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        run: |
          curl -sf "https://github-readme-activity-graph.vercel.app/graph?username=muhe-byte&bg_color=0D1117&color=2EA44F&line=2EA44F&point=FFFFFF&hide_border=true&theme=react-dark" -o profile/activity-graph.svg || echo "activity graph fetch failed, keeping previous version"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
